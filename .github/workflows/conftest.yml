name: Conftest OPA Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conftest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install conftest
        run: |
          set -e
          CONFTEST_VERSION="0.56.0"
          curl -L -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Non-compliant S3 should fail (expected)
        continue-on-error: true
        run: |
          set +e
          conftest test infra/examples/bad_s3/main.tf \
            -p policy/opa/baseline \
            --parser hcl2 \
            --all-namespaces
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "ERROR: bad_s3 unexpectedly PASSED (it should FAIL)"
            exit 1
          fi
          echo "OK: bad_s3 failed as expected"
          exit 0

      - name: Compliant S3 should pass
        run: |
          conftest test infra/examples/good_s3/main.tf \
            -p policy/opa/baseline \
            --parser hcl2 \
            --all-namespaces
